name: Deliberate failure lab
run-name: "Failure lab / ${{ inputs.scenario }}"
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Synthetic failure for the CI Debug Agent
        required: true
        type: choice
        options: [missing-dependency, simulated-timeout]
permissions:
  contents: read
jobs:
  failure-scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Emit synthetic failure
        env:
          LAB_SCENARIO: ${{ inputs.scenario }}
        run: python tools/failure_scenarios.py
